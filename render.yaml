# Render Blueprint — backend API only (munshi-api)
#
# Repo: https://github.com/VektoAI/Lawyer_Mobile
# Flutter APK is built locally — not deployed on Render.
#
# After Blueprint Apply, set secrets in Render dashboard (see DEPLOY.md).

services:
  - type: web
    name: munshi-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MUNSHI_DEMO
        value: "0"
      - key: MUNSHI_SERVE_UI
        value: "0"
      - key: MUNSHI_OPENAPI
        value: "0"
      # NOT a web frontend — legacy env name. Set to this same backend URL (mobile-only deploy).
      - key: MUNSHI_FRONTEND_URL
        value: https://munshi-api.onrender.com
      # Deep link opened by the Android app after email verification.
      - key: MUNSHI_MOBILE_AUTH_REDIRECT
        value: casevault://auth/confirm
      - key: MUNSHI_CORS_ORIGINS
        value: http://127.0.0.1:4173,http://localhost:4173
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MUNSHI_CRON_SECRET
        sync: false
      - key: MUNSHI_ADMIN_TOKEN
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
